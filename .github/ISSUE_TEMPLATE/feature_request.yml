name: Feature request
description: Suggest an idea or improvement
labels: ["feature"]
body:
  - type: markdown
    attributes:
      value: |
        This project deliberately has **no external dependencies** (stdlib
        only) and currently only supports `type == "IMAGE"` Immich assets.
        Keep that in mind when proposing something — it doesn't rule out
        the idea, but it may affect how it'd be implemented.

  - type: textarea
    id: problem
    attributes:
      label: What problem does this solve?
      description: What are you trying to do that isn't currently possible or is awkward today?
    validations:
      required: true

  - type: textarea
    id: proposal
    attributes:
      label: Proposed solution
      description: How would you like this to work?
    validations:
      required: true

  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
      description: Any workarounds or other approaches you've thought about.
    validations:
      required: false
