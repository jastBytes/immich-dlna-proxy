name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_call: {}

permissions:
  contents: read

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: "1.26.5"
          cache: true

      - uses: golangci/golangci-lint-action@v7
        with:
          version: v2.12.2

  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: "1.26.5"
          cache: true

      - name: gofmt check
        run: |
          fmt_out=$(gofmt -l .)
          if [ -n "$fmt_out" ]; then
            echo "Not gofmt'd:"
            echo "$fmt_out"
            exit 1
          fi

      - name: go vet
        run: go vet ./...

      - name: go test
        run: go test ./... -v -race

  # Cross-compile + Docker build check are skipped on pull_request runs to
  # keep PR CI fast; they still run on pushes to main and when this
  # workflow is called for release verification (workflow_call).
  build:
    runs-on: ubuntu-latest
    if: github.event_name != 'pull_request'
    needs: [lint, test]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: "1.26.5"
          cache: true

      - name: go build (all platforms below)
        run: |
          set -e
          for OS in linux darwin; do
            for ARCH in amd64 arm64; do
              echo "building $OS/$ARCH"
              GOOS=$OS GOARCH=$ARCH CGO_ENABLED=0 go build -o /dev/null .
            done
          done

  docker-build-check:
    runs-on: ubuntu-latest
    if: github.event_name != 'pull_request'
    needs: [lint, test]
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - name: Build image (not pushed) to catch Dockerfile breakage early
        uses: docker/build-push-action@v6
        with:
          context: .
          push: false
