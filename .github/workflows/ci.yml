name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_call: {}

permissions:
  contents: read

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: "1.26.5"
          cache: true

      - uses: golangci/golangci-lint-action@v7
        with:
          version: v2.12.2

  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: "1.26.5"
          cache: true

      - name: gofmt check
        run: |
          fmt_out=$(gofmt -l .)
          if [ -n "$fmt_out" ]; then
            echo "Not gofmt'd:"
            echo "$fmt_out"
            exit 1
          fi

      - name: go vet
        run: go vet ./...

      - name: go test
        run: go test ./... -v -race

  # Cross-compile is skipped on pull_request runs to keep PR CI fast; it
  # still runs on pushes to main and when this workflow is called for
  # release verification (workflow_call).
  build:
    runs-on: ubuntu-latest
    if: github.event_name != 'pull_request'
    needs: [lint, test]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: "1.26.5"
          cache: true

      - name: go build (all platforms below)
        run: |
          set -e
          for OS in linux darwin; do
            for ARCH in amd64 arm64; do
              echo "building $OS/$ARCH"
              GOOS=$OS GOARCH=$ARCH CGO_ENABLED=0 go build -o /dev/null .
            done
          done

  # A real Docker image gets built (and, on the trusted paths, pushed) by
  # docker-publish-pr / docker-publish-main below, which doubles as the
  # Dockerfile breakage check. This job only needs to run where neither of
  # those does: release verification (workflow_call), and PRs from forks
  # (which docker-publish-pr deliberately skips pushing for - see there).
  docker-build-check:
    runs-on: ubuntu-latest
    if: |
      github.event_name == 'workflow_call' ||
      (github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name != github.repository)
    needs: [lint, test]
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - name: Build image (not pushed) to catch Dockerfile breakage early
        uses: docker/build-push-action@v6
        with:
          context: .
          push: false

  # Builds and pushes an image to the -dev suffixed package for PRs from
  # this repository (not forks - GITHUB_TOKEN is always read-only for
  # fork PRs, so pushing would just fail there; docker-build-check above
  # covers those instead).
  docker-publish-pr:
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository
    needs: [lint, test]
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-qemu-action@v3

      - uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Compute image tags
        id: meta
        run: |
          repo_lower=$(echo "${{ github.repository }}" | tr '[:upper:]' '[:lower:]')
          short_sha=$(echo "${{ github.event.pull_request.head.sha }}" | cut -c1-7)
          {
            echo "image=ghcr.io/${repo_lower}-dev"
            echo "short_sha=${short_sha}"
          } >> "$GITHUB_OUTPUT"

      - name: Build and push dev image
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: |
            ${{ steps.meta.outputs.image }}:pr-${{ github.event.pull_request.number }}
            ${{ steps.meta.outputs.image }}:${{ steps.meta.outputs.short_sha }}

  # Builds and pushes an image to the -preview suffixed package on every
  # push to main.
  docker-publish-main:
    runs-on: ubuntu-latest
    if: github.event_name == 'push'
    needs: [lint, test]
    permissions:
      contents: write
      pull-requests: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-qemu-action@v3

      - uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # dry-run: true stops the action from publishing a non-draft release,
      # but it still calls the Releases API to create/update the draft
      # (release-drafter.yml does the same on its own trigger) to compute
      # resolved_version, so this job needs contents: write - with only
      # contents: read the call 403s, the step fails, and resolved_version
      # silently resolves to "" downstream, ending up as a `:-preview` tag.
      - name: Resolve next release version
        id: version
        uses: release-drafter/release-drafter@v6
        with:
          dry-run: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Verify resolved version
        run: |
          if [ -z "${{ steps.version.outputs.resolved_version }}" ]; then
            echo "::error::release-drafter did not return a resolved_version output - refusing to build a '-preview' image with an empty version tag" >&2
            exit 1
          fi

      - name: Compute image tags
        id: meta
        run: |
          repo_lower=$(echo "${{ github.repository }}" | tr '[:upper:]' '[:lower:]')
          short_sha=$(echo "${{ github.sha }}" | cut -c1-7)
          {
            echo "image=ghcr.io/${repo_lower}-preview"
            echo "short_sha=${short_sha}"
          } >> "$GITHUB_OUTPUT"

      - name: Build and push preview image
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: |
            ${{ steps.meta.outputs.image }}:latest
            ${{ steps.meta.outputs.image }}:${{ steps.meta.outputs.short_sha }}
            ${{ steps.meta.outputs.image }}:${{ steps.version.outputs.resolved_version }}
