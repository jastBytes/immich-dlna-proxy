name-template: 'v$RESOLVED_VERSION'
tag-template: 'v$RESOLVED_VERSION'

categories:
  - title: '🚀 Features'
    labels:
      - 'feature'
      - 'enhancement'
  - title: '🐛 Bug Fixes'
    labels:
      - 'fix'
      - 'bugfix'
      - 'bug'
  - title: '🧰 Maintenance'
    labels:
      - 'chore'
      - 'refactor'
      - 'ci'
  - title: '📝 Documentation'
    labels:
      - 'documentation'
  - title: '⬆️ Dependencies'
    labels:
      - 'dependencies'
    collapse-after: 5

change-template: '- $TITLE (#$NUMBER) @$AUTHOR'
change-title-escapes: '\<*_&'

version-resolver:
  major:
    labels:
      - 'major'
      - 'breaking'
  minor:
    labels:
      - 'minor'
      - 'feature'
      - 'enhancement'
  patch:
    labels:
      - 'patch'
      - 'fix'
      - 'bugfix'
      - 'bug'
      - 'chore'
      - 'dependencies'
      - 'documentation'
  default: patch

autolabeler:
  - label: 'dependencies'
    title:
      - '/^Bump /i'
      - '/^(chore|build)\(deps\):/i'
  - label: 'documentation'
    files:
      - '**/*.md'
  - label: 'ci'
    files:
      - '.github/workflows/**'
  - label: 'bug'
    branch:
      - '/fix\/.+/'
    title:
      - '/^fix/i'
  - label: 'feature'
    branch:
      - '/feature\/.+/'
    title:
      - '/^feat/i'

exclude-labels:
  - 'skip-changelog'

template: |
  ## Changes

  $CHANGES
